name: Verify LookBridge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: macos-14
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  installer:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: tools/test-installer.sh
      - run: tools/build.sh
